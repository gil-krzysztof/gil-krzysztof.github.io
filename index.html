<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podgląd Mapy Refrakcji Szkła</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #1a1a1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .container {
    text-align: center;
    background: #2a2a2a;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  h1 {
    font-size: 22px;
    margin-bottom: 10px;
  }

  p {
    color: #b0b0b0;
    font-size: 14px;
    max-width: 450px;
    margin: 0 auto 20px auto;
    line-height: 1.4;
  }

  canvas {
    border: 2px solid #444;
    border-radius: 12px;
    background-color: #808080;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Podgląd Mapy Dyspersji (Displacement Map)</h1>
    <p>Szare tło (rgb 128, 128) oznacza brak przesunięcia. Kolorowe obrzeża na krawędziach i rogach sterują poziomym (R) i pionowym (G) zagięciem światła.</p>
    
    <!-- Canvas na którym generujemy mapę -->
    <canvas id="mapCanvas" width="400" height="250"></canvas>
  </div>

  <script>
    function generateRefractionMap() {
      const canvas = document.getElementById('mapCanvas');
      const ctx = canvas.getContext('2d');
      
      const w = canvas.width;
      const h = canvas.height;
      
      const imgData = ctx.createImageData(w, h);
      const data = imgData.data;

      // Geometria karty
      const cornerRadius = 35; // Promień zaokrąglenia rogów
      const rimWidth = 35;     // Szerokość strefy krawędziowej (ramki soczewki)

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          
          // Obliczanie odległości od zaokrąglonych krawędzi prostokąta
          let qx = Math.abs(x - w / 2) - (w / 2 - cornerRadius);
          let qy = Math.abs(y - h / 2) - (h / 2 - cornerRadius);
          
          let distCorner = Math.sqrt(Math.max(qx, 0) ** 2 + Math.max(qy, 0) ** 2);
          let distEdge = distCorner + Math.min(Math.max(qx, qy), 0) - cornerRadius;
          let depthFromBorder = -distEdge; // Głębokość wnikania od zewnętrznej krawędzi

          let shiftX = 0;
          let shiftY = 0;

          // Działamy tylko w pasie krawędziowym
          if (depthFromBorder >= 0 && depthFromBorder <= rimWidth) {
            let normalizedDist = depthFromBorder / rimWidth; // 0 (brzeg) do 1 (wnętrze)
            
            // Profil soczewki oparty na funkcji sinus
            let lensProfile = Math.sin(normalizedDist * Math.PI) * (1 - normalizedDist);

            let nx = 0, ny = 0;
            if (qx > 0 || qy > 0) {
              let len = Math.sqrt(Math.max(qx, 0) ** 2 + Math.max(qy, 0) ** 2) || 1;
              nx = (Math.max(qx, 0) / len) * Math.sign(x - w / 2);
              ny = (Math.max(qy, 0) / len) * Math.sign(y - h / 2);
            } else {
              if (qx > qy) nx = Math.sign(x - w / 2);
              else ny = Math.sign(y - h / 2);
            }

            shiftX = nx * lensProfile;
            shiftY = ny * lensProfile;
          }

          // Mapowanie na kanały RGB (128 to punkt neutralny)
          let redChannel   = Math.min(255, Math.max(0, 128 + shiftX * 127));
          let greenChannel = Math.min(255, Math.max(0, 128 + shiftY * 127));
          let blueChannel  = 128; // Nieużywany

          let index = (y * w + x) * 4;
          data[index]     = redChannel;   // Kanał Red (Oś X)
          data[index + 1] = greenChannel; // Kanał Green (Oś Y)
          data[index + 2] = blueChannel;  // Kanał Blue
          data[index + 3] = 255;          // Alpha
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    // Uruchomienie generowania po załadowaniu skryptu
    generateRefractionMap();
  </script>

</body>
</html>
