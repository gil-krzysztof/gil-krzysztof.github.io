<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poprawiona Mapa Refrakcji Karty</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #1a1a1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .container {
    text-align: center;
    background: #2a2a2a;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  h1 {
    font-size: 20px;
    margin-bottom: 10px;
  }

  p {
    color: #b0b0b0;
    font-size: 14px;
    max-width: 450px;
    margin: 0 auto 20px auto;
    line-height: 1.4;
  }

  canvas {
    border: 2px solid #444;
    border-radius: 40px; /* Wizualne dopasowanie podglądu do rogów karty */
    background-color: #808080;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Poprawiona Mapa Dyspersji</h1>
    <p>Teraz zaokrąglenia rogów idealnie pokrywają się z promieniem 40px Twoich kart, tworząc gładką ramkę soczewkową.</p>
    
    <canvas id="mapCanvas" width="400" height="250"></canvas>
  </div>

  <script>
    function generateCorrectedMap() {
      const canvas = document.getElementById('mapCanvas');
      const ctx = canvas.getContext('2d');
      
      const w = canvas.width;
      const h = canvas.height;
      
      const imgData = ctx.createImageData(w, h);
      const data = imgData.data;

      const cornerRadius = 40; 
      const rimWidth = 30;     

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          
          // 1. Określamy strefy dla rogów i krawędzi
          let leftBound = cornerRadius;
          let rightBound = w - cornerRadius;
          let topBound = cornerRadius;
          let bottomBound = h - cornerRadius;

          let distFromEdge = 0;
          let nx = 0, ny = 0;

          // Sprawdzamy, czy piksel jest w jednym z 4 rogów
          let isTopLeft = x < leftBound && y < topBound;
          let isTopRight = x > rightBound && y < topBound;
          let isBottomLeft = x < leftBound && y > bottomBound;
          let isBottomRight = x > rightBound && y > bottomBound;

          if (isTopLeft || isTopRight || isBottomLeft || isBottomRight) {
            // Logika dla rogów (promień łuku)
            let cx = isTopLeft || isBottomLeft ? leftBound : rightBound;
            let cy = isTopLeft || isTopRight ? topBound : bottomBound;
            
            let dx = x - cx;
            let dy = y - cy;
            let distFromCenter = Math.sqrt(dx * dx + dy * dy);
            
            distFromEdge = cornerRadius - distFromCenter;
            
            if (distFromCenter > 0) {
              nx = dx / distFromCenter;
              ny = dy / distFromCenter;
            }
          } else {
            // Logika dla prostych krawędzi (góra, dół, lewo, prawo)
            let distLeft = x;
            let distRight = w - x;
            let distTop = y;
            let distBottom = h - y;

            let minDist = Math.min(distLeft, distRight, distTop, distBottom);
            distFromEdge = minDist;

            if (minDist === distLeft) { nx = 1; ny = 0; }
            else if (minDist === distRight) { nx = -1; ny = 0; }
            else if (minDist === distTop) { nx = 0; ny = 1; }
            else if (minDist === distBottom) { nx = 0; ny = -1; }
          }

          let shiftX = 0;
          let shiftY = 0;

          // 2. Profil soczewki w pasie krawędziowym
          if (distFromEdge >= 0 && distFromEdge <= rimWidth) {
            let normalized = distFromEdge / rimWidth; // Od 0 (zewnętrzny brzeg) do 1 (wnętrze)
            let lens = Math.sin(normalized * Math.PI); // Płynna fala wypukłości

            shiftX = nx * lens;
            shiftY = ny * lens;
          }

          // 3. Mapowanie na kanały RGB (128 to neutralna szarość)
          let red   = Math.min(255, Math.max(0, 128 + shiftX * 127));
          let green = Math.min(255, Math.max(0, 128 + shiftY * 127));
          let blue  = 128;

          let index = (y * w + x) * 4;
          data[index]     = red;
          data[index + 1] = green;
          data[index + 2] = blue;
          data[index + 3] = 255;
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    generateCorrectedMap();
  </script>

</body>
</html>
