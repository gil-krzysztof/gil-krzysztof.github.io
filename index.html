<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krzysztof Gil</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      justify-content: flex-end;
      gap: 40px;
      padding: 30px 40px;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: #1a1a1a;
    }

    nav a {
      color: inherit;
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      font-weight: 800;
      font-size: clamp(48px, 9vw, 140px);
      line-height: 1;
      letter-spacing: -0.02em;
      color: #111111;
    }

    .hero img {
      height: clamp(48px, 9vw, 140px);
      width: auto;
      object-fit: cover;
      margin: 0 4px;
      vertical-align: middle;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 30px 40px;
      font-size: 12px;
      color: #3b3b3b;
      gap: 20px;
    }

    footer .right {
      max-width: 320px;
      text-align: right;
    }

    @media (max-width: 600px) {
      nav {
        gap: 20px;
        font-size: 11px;
        padding: 20px;
      }
      footer {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 10px;
      }
      footer .right {
        text-align: center;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="#">Fotografia</a>
    <a href="#">O mnie</a>
    <a href="#">Korepetycje</a>
    <a href="#">Kontakt</a>
  </nav>

  <main>
    <div class="hero">
      Krzysztof<img src="Zdjecie_1500.jpeg" alt="Zdjęcie z Wenecji">Gil
    </div>
  </main>

  <footer>
    <div class="left">Fotografia amatorska<br>Wenecja, 2026</div>
    <div class="right">Dokumentuję podróże i uczę się tworzyć strony internetowe.</div>
  </footer>
</body>
</html>
