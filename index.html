<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsywny Szklany Efekt SVG</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  /* Kontener testowy z siatką w tle, żeby było widać refrakcję */
  .bg-grid {
    position: relative;
    width: 100%;
    max-width: 700px;
    height: 450px;
    background-image: 
      radial-gradient(circle, rgba(255,255,255,0.15) 2px, transparent 2px),
      linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  /* Szklana karta responsywna */
  .glass-card {
    width: 60%;
    height: 60%;
    min-width: 280px;
    min-height: 180px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 40px; /* Zgodne z Twoim promieniem rogów */
    backdrop-filter: url(#glass-lens) blur(0px); /* Użycie filtra refrakcji wektorowej */
    -webkit-backdrop-filter: url(#glass-lens) blur(0px);
    box-shadow: 
      inset 0 1px 1px rgba(255, 255, 255, 0.4),
      inset 0 -1px 2px rgba(0, 0, 0, 0.3),
      0 15px 35px rgba(0, 0, 0, 0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    padding: 20px;
    text-align: center;
    box-sizing: border-box;
  }

  .glass-card h2 {
    margin: 0 0 10px 0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }

  .glass-card p {
    margin: 0;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

  <!-- Ukryta definicja wektorowego filtra SVG -->
  <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
    <filter id="glass-lens" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
      
      <!-- Krok 1: Generujemy wewnętrzną mapę gradientową na bazie obiektowej przestrzeni -->
      <feImage href="#lens-gradient" result="map" preserveAspectRatio="none" />
      
      <!-- Krok 2: Używamy mapy do fizycznego zniekształcenia pikseli tła (skala określa głębię soczewki) -->
      <feDisplacementMap in="SourceGraphic" in2="map" scale="25" xChannelSelector="R" yChannelSelector="G" result="refracted" />
      
      <!-- Krok 3: Dodanie delikatnego podbicia kontrastu/koloru -->
      <feComposite in="refracted" in2="SourceAlpha" operator="in" />
    </filter>

    <!-- Wektorowy wzorzec mapy refrakcji dopasowujący się automatycznie do proporcji elementu -->
    <linearGradient id="g-horiz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000" />    <!-- Przesunięcie w lewo/prawo -->
      <stop offset="5%" stop-color="#808080" />
      <stop offset="95%" stop-color="#808080" />
      <stop offset="100%" stop-color="#ff0000" />
    </linearGradient>
  </svg>

  <div class="bg-grid">
    <div class="glass-card">
      <h2>Krzysztof</h2>
      <p>W 100% responsywna szklana karta z filtrem wektorowym SVG</p>
    </div>
  </div>

</body>
</html>
