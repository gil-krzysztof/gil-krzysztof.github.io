<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Czysty Podgląd Mapy Refrakcji</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .wrapper {
    text-align: center;
    background: #1e1e1e;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  h2 {
    margin-bottom: 5px;
    font-size: 18px;
  }

  p {
    color: #888;
    font-size: 13px;
    margin-bottom: 20px;
  }

  /* Płótno z samą mapą */
  canvas {
    border: 1px solid #444;
    border-radius: 40px; /* Zgodne z zaokrągleniem Twoich kart */
    background-color: #808080;
  }
</style>
</head>
<body>

<div class="wrapper">
  <h2>Mapa Refrakcji (Displacement Map)</h2>
  <p>Neutralna szarość (128,128,128) w środku + kolorowe kanały X/Y na krawędziach</p>
  
  <canvas id="rawMapCanvas" width="400" height="250"></canvas>
</div>

<script>
  function renderRawMap() {
    const canvas = document.getElementById('rawMapCanvas');
    const ctx = canvas.getContext('2d');
    
    const w = canvas.width;
    const h = canvas.height;
    
    const imgData = ctx.createImageData(w, h);
    const data = imgData.data;

    const cornerRadius = 40; 
    const rimWidth = 30;     

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        
        let leftBound = cornerRadius;
        let rightBound = w - cornerRadius;
        let topBound = cornerRadius;
        let bottomBound = h - cornerRadius;

        let distFromEdge = 0;
        let nx = 0, ny = 0;

        let isTopLeft = x < leftBound && y < topBound;
        let isTopRight = x > rightBound && y < topBound;
        let isBottomLeft = x < leftBound && y > bottomBound;
        let isBottomRight = x > rightBound && y > bottomBound;

        if (isTopLeft || isTopRight || isBottomLeft || isBottomRight) {
          let cx = isTopLeft || isBottomLeft ? leftBound : rightBound;
          let cy = isTopLeft || isTopRight ? topBound : bottomBound;
          
          let dx = x - cx;
          let dy = y - cy;
          let distFromCenter = Math.sqrt(dx * dx + dy * dy);
          
          distFromEdge = cornerRadius - distFromCenter;
          
          if (distFromCenter > 0) {
            nx = dx / distFromCenter;
            ny = dy / distFromCenter;
          }
        } else {
          let distLeft = x;
          let distRight = w - x;
          let distTop = y;
          let distBottom = h - y;

          let minDist = Math.min(distLeft, distRight, distTop, distBottom);
          distFromEdge = minDist;

          if (minDist === distLeft) { nx = 1; ny = 0; }
          else if (minDist === distRight) { nx = -1; ny = 0; }
          else if (minDist === distTop) { nx = 0; ny = 1; }
          else if (minDist === distBottom) { nx = 0; ny = -1; }
        }

        let shiftX = 0;
        let shiftY = 0;

        if (distFromEdge >= 0 && distFromEdge <= rimWidth) {
          let normalized = distFromEdge / rimWidth;
          let lens = Math.sin(normalized * Math.PI);

          shiftX = nx * lens;
          shiftY = ny * lens;
        }

        // Kanał Red (oś X) i Green (oś Y), Blue stałe (neutralne)
        let red   = Math.min(255, Math.max(0, 128 + shiftX * 127));
        let green = Math.min(255, Math.max(0, 128 + shiftY * 127));
        let blue  = 128;

        let index = (y * w + x) * 4;
        data[index]     = red;
        data[index + 1] = green;
        data[index + 2] = blue;
        data[index + 3] = 255;
      }
    }

    ctx.putImageData(imgData, 0, 0);
  }

  renderRawMap();
</script>

</body>
</html>
