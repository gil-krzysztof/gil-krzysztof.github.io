<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    background-color: #f0f0f0;
    font-family: 'Inter', Arial, sans-serif;
  }
  .content-wrapper {
    max-width: 1300px;
    margin: 0 auto;
    background-color: white;
    position: relative;
    height: 200vh;
    display: flex;
    justify-content: center;
    padding-top: 25vh;
  }
  .corner-note {
    position: absolute;
    top: 4vh;
    left: 4vw;
    font-size: 2vh;
    color: black;
  }
  .headline-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    height: fit-content;
  }
  .laurel {
    width: 40px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 4vh;
    font-weight: 600;
    line-height: 1.22;
    letter-spacing: -0.02em;
    text-align: center;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="content-wrapper">
    <div class="corner-note">Krzysztof Gil</div>
    <div class="headline-row">
      <img src="laura_lewy_wektor.svg" alt="" class="laurel">
      <h1>Matematyka rozszerzona online<br>Z wynikiem 100% z matury</h1>
      <img src="laura_prawy_wektor.svg" alt="" class="laurel">
    </div>
  </div>
</body>
</html>
