<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poprawiona Mapa Refrakcji Karty</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #1a1a1a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .container {
    text-align: center;
    background: #2a2a2a;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  h1 {
    font-size: 20px;
    margin-bottom: 10px;
  }

  p {
    color: #b0b0b0;
    font-size: 14px;
    max-width: 450px;
    margin: 0 auto 20px auto;
    line-height: 1.4;
  }

  canvas {
    border: 2px solid #444;
    border-radius: 40px; /* Wizualne dopasowanie podglądu do rogów karty */
    background-color: #808080;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Poprawiona Mapa Dyspersji</h1>
    <p>Teraz zaokrąglenia rogów idealnie pokrywają się z promieniem 40px Twoich kart, tworząc gładką ramkę soczewkową.</p>
    
    <canvas id="mapCanvas" width="400" height="250"></canvas>
  </div>

  <script>
    function generateCorrectedMap() {
      const canvas = document.getElementById('mapCanvas');
      const ctx = canvas.getContext('2d');
      
      const w = canvas.width;
      const h = canvas.height;
      
      const imgData = ctx.createImageData(w, h);
      const data = imgData.data;

      // Geometria zgodna z Twoimi kartami CSS (border-radius: 40px)
      const cornerRadius = 40; 
      const rimWidth = 30;     // Szerokość strefy zagięcia krawędzi

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          
          // Precyzyjna funkcja odległości (SDF) dla zaokrąglonego prostokąta
          let cx = Math.max(0, Math.abs(x - w / 2) - (w / 2 - cornerRadius));
          let cy = Math.max(0, Math.abs(y - h / 2) - (h / 2 - cornerRadius));
          let outsideDist = Math.sqrt(cx * cx + cy * cy);
          
          let insideX = Math.max(0, w / 2 - cornerRadius - Math.abs(x - w / 2));
          let insideY = Math.max(0, h / 2 - cornerRadius - Math.abs(y - h / 2));
          let insideDist = Math.min(0, -Math.max(insideX, insideY));
          
          // Całkowity dystans od krawędzi (ujemny wewnątrz, zero na brzegu, dodatny na zewnątrz)
          let distanceToEdge = outsideDist + insideDist - cornerRadius;
          
          // Głębokość w głąb karty od zewnętrznego obrysu
          let depth = -distanceToEdge;

          let shiftX = 0;
          let shiftY = 0;

          // Działamy wyłącznie w pasie krawędziowym o szerokości rimWidth
          if (depth >= 0 && depth <= rimWidth) {
            let normalized = depth / rimWidth; // Od 0 (brzeg) do 1 (wnętrze)
            
            // Profil soczewki (płynna fala)
            let lens = Math.sin(normalized * Math.PI) * (1 - normalized);

            // Wektor kierunku ugięcia światła prostopadle do krawędzi
            let dx = x - w / 2;
            let dy = y - h / 2;
            let len = Math.sqrt(dx * dx + dy * dy) || 1;

            shiftX = (dx / len) * lens;
            shiftY = (dy / len) * lens;
          }

          // Mapowanie na kanały RGB (128, 128, 128 to punkt neutralny / brak przesunięcia)
          let red   = Math.min(255, Math.max(0, 128 + shiftX * 127));
          let green = Math.min(255, Math.max(0, 128 + shiftY * 127));
          let blue  = 128;

          let index = (y * w + x) * 4;
          data[index]     = red;
          data[index + 1] = green;
          data[index + 2] = blue;
          data[index + 3] = 255;
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    generateCorrectedMap();
  </script>

</body>
</html>
