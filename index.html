<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsywna Mapa Refrakcji</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  canvas {
    /* Możesz tutaj zmienić rozmiar wyświetlania w CSS, 
       a mapa dopasuje się do atrybutów width/height w HTML */
    width: 400px;
    height: 300px;
    border-radius: 40px;
    background-color: #808080;
  }
</style>
</head>
<body>

  <!-- Zmieniając te atrybutach width i height, mapa przeliczy się na nową rozdzielczość -->
  <canvas id="mapCanvas" width="400" height="250"></canvas>

  <script>
    function generateResponsiveMap() {
      const canvas = document.getElementById('mapCanvas');
      const ctx = canvas.getContext('2d');
      
      // Pobieramy aktualne wymiary z canvasu
      const w = canvas.width;
      const h = canvas.height;
      
      const imgData = ctx.createImageData(w, h);
      const data = imgData.data;

      // Sztywny, niezmienny promień rogów (zawsze 40px)
      const cornerRadius = 40; 
      const rimWidth = 40;     

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          
          let qx = Math.abs(x - w / 2) - (w / 2 - cornerRadius);
          let qy = Math.abs(y - h / 2) - (h / 2 - cornerRadius);
          
          let distCorner = Math.sqrt(Math.max(qx, 0) ** 2 + Math.max(qy, 0) ** 2);
          let distEdge = distCorner + Math.min(Math.max(qx, qy), 0) - cornerRadius;
          let depthFromBorder = -distEdge;

          let shiftX = 0;
          let shiftY = 0;

          if (depthFromBorder >= 0 && depthFromBorder <= rimWidth) {
            let normalizedDist = depthFromBorder / rimWidth;
            let lensProfile = Math.sin(normalizedDist * Math.PI) * (1 - normalizedDist);

            let nx = 0, ny = 0;
            if (qx > 0 || qy > 0) {
              let len = Math.sqrt(Math.max(qx, 0) ** 2 + Math.max(qy, 0) ** 2) || 1;
              nx = (Math.max(qx, 0) / len) * Math.sign(x - w / 2);
              ny = (Math.max(qy, 0) / len) * Math.sign(y - h / 2);
            } else {
              if (qx > qy) nx = Math.sign(x - w / 2);
              else ny = Math.sign(y - h / 2);
            }

            shiftX = nx * lensProfile;
            shiftY = ny * lensProfile;
          }

          let redChannel   = Math.min(255, Math.max(0, 128 + shiftX * 127));
          let greenChannel = Math.min(255, Math.max(0, 128 + shiftY * 127));
          let blueChannel  = 128;

          let index = (y * w + x) * 4;
          data[index]     = redChannel;
          data[index + 1] = greenChannel;
          data[index + 2] = blueChannel;
          data[index + 3] = 255;
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    generateResponsiveMap();
  </script>

</body>
</html>
