<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body {
  max-width: 900px;
  margin: 0 auto;
  height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', Arial, sans-serif;
  position: relative; /* dodane */
}

.corner-note {
  position: absolute;
  top: 2vh;
  left: 2vw;
  font-size: 2vh;
  color: black;
}
  .headline-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
  }
  .laurel {
    width: 64px;
    height: 200px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 50px;
    font-weight: 600;
    line-height: 1.22;
    letter-spacing: -0.02em;
    text-align: center;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="corner-note">Krzysztof Gil</div>
  <div class="headline-row">
    <img src="laura_lewy_wektor.svg" alt="" class="laurel">
    <h1>Matematyka rozszerzona online<br>Z wynikiem 100% z matury</h1>
    <img src="laura_prawy_wektor.svg" alt="" class="laurel">
  </div>
</body>
</html>
