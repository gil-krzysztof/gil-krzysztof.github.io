<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    background-color: #f0f0f0;
    font-family: 'Inter', Arial, sans-serif;
  }
  .content-wrapper {
    max-width: 1300px;
    margin: 0 auto;
    background-color: white;
    position: relative;
    height: 200vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 25vh;
  }
  .corner-note {
    position: absolute;
    top: 4vh;
    left: 4vw;
    font-size: 2vh;
    color: black;
  }
  .contact-button {
    position: absolute;
    top: 4vh;
    right: 4vw;
    padding: 15px 25px;
    background-color: white;
    border: 2px solid black;
    border-radius: 8px;
    font-family: 'Inter', Arial, sans-serif;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
  }
  .headline-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    height: fit-content;
  }
  .laurel {
    width: 40px;
    flex-shrink: 0;
  }
  h1 {
    font-size: 40px;
    font-weight: 600;
    line-height: 1.22;
    letter-spacing: -0.02em;
    text-align: center;
    margin: 0;
  }
  .subtitle {
    max-width: 1100px;
    margin-top: 30px;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.5;
    text-align: center;
    color: #333;
  }
</style>
</head>
<body>
  <div class="content-wrapper">
    <div class="corner-note">Krzysztof Gil</div>
    <button class="contact-button">Kontakt</button>
    <div class="headline-row">
      <img src="laura_lewy_wektor.svg" alt="" class="laurel">
      <h1>Matematyka rozszerzona online<br>Z wynikiem 100% z matury</h1>
      <img src="laura_prawy_wektor.svg" alt="" class="laurel">
    </div>
    <p class="subtitle">Cześć! Jestem studentem pierwszego roku Lotnictwa i Kosmonautyki na Politechnice Warszawskiej i pomogę Ci dostać się na wymarzony kierunek.</p>
  </div>
</body>
</html>
