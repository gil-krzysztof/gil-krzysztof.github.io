<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krzysztof Gil</title>
  <style>
    body {
      margin: 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: #ffffff;
    }
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      color: #3b3b3b;
      text-align: center;
      padding: 10px 0;
      font-family: sans-serif;
      z-index: 1000;
    }
    .content {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="top-bar">Wenecja</div>
  <div class="content">
    <img src="Zdjecie_1500.jpeg" alt="San Giorgio Maggiore" loading="lazy">
    <img src="Zdjecie_1500-2.jpeg" alt="Kanał Grande. Kamienice" loading="lazy"> 
    <img src="Zdjecie_1500-3.jpeg" alt="Dzwonnica św. Marka w Wenecji" loading="lazy">
    <img src="Zdjecie_1500-4.jpeg" alt="Fasada Pałacu Dożów" loading="lazy">
    <img src="Zdjecie_1500-5.jpeg" alt="Gondolier" loading="lazy">
    <img src="Zdjecie_1500-6.jpeg" alt="Maski karnawałowe" loading="lazy">
  </div>
</body>
</html>
